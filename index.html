<script type="module">
/* ═══ ZOMBIE WAVES · a Multiplayer Agent starter ═══════════════════════════════════════
 * Hold the base against bigger and bigger waves. Co-op, 1–4 players; bots fill the team.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ waves, zombies, weapons, the team size
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   WORLD ......... ground, the base and its generator, fence, trees (all drawn in code)
 *   SURVIVORS ..... the survivor model, name tags, the downed/revive ring
 *   ZOMBIES ....... how zombies are packed into state, and how they are drawn (instanced)
 *   EFFECTS ....... bullets, particles, sounds
 *   WAVES (HOST) .. waves, zombie brains, bites, bots. Only the host writes these.
 *   ME ............ moving, shooting, being bitten, getting revived. Each player writes its own.
 *   HUD & RESULTS . wave, generator, team, results, leaderboard
 *   INPUT ......... keyboard + mouse, and twin thumb sticks on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the horde):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: x, z, aim, hp, down,
 *     shots, revive) about 10 times a second, `hb` (heartbeat) once a second, and
 *     `n`/`c` (name, color) once. Each player owns its own health.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `wave`  {id, v, phase: break|fight|over, n, endsAt}: written only on a change; v goes up
 *       `z0`..`z2` every zombie, packed 9 characters each (see ZOMBIES), 10 times a second
 *       `base`  {hp, kills, queue}: generator health, kills per player, zombies still to come
 *       `bots`  the AI teammates, 10 times a second
 *     A new host adopts all of it from state and carries on: same wave, same zombies.
 *   - You shoot on your own screen. When your bullet hits a zombie you send a `hit` intent
 *     {z: zombie id}; the host takes the health off (and applies its own hits directly).
 *   - Zombies bite by event: the host sends `bite` {to, d} (the damage of the last 250ms) and
 *     only the bitten player takes it off its own health. The host bites bots directly.
 *   - Downed? A teammate standing next to you for a few seconds gets you up. You check that
 *     yourself, from everyone's positions in state. Every new wave gets everyone back up.
 *   - `again` (intent): a player pressed Play again on the results card.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "best-wave": the wave each player reached, shown when the base falls.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  team: 4,               // bots fill the team up to this many survivors

  spawnRadius: 35,       // zombies shamble in from this far out
  maxAlive: 60,          // most zombies on the field at once (the rest wait their turn)
  startWave: 1,          // the wave a new game starts on
  firstBreak: 3000,      // ms before the first wave
  breakMs: 6000,         // ms between waves
  resultsMs: 15000,      // ms the results show before a new game starts on its own
  waveSize: 8,           // zombies in wave 1 ...
  waveGrow: 4,           // ... and this many more every wave
  spawnEvery: 0.5,       // seconds between zombie spawns in wave 1 ...
  spawnFaster: 0.035,    // ... this much less every wave (down to 0.15)
  zombieSpeed: 2.1,      // walker speed, units/s (runners are faster, brutes slower)
  zombieSpeedGrow: 0.1,  // extra speed per wave
  zombieHp: 3,           // walker health, +1 every 2 waves
  biteDamage: 12,        // health one bite takes (brutes bite twice as hard)
  aggro: 14,             // zombies chase survivors closer than this, else go for the generator
  genHp: 50,             // generator health: the game ends when it hits 0
  hp: 100,               // survivor health
  speed: 6.5,            // survivor walk speed, units/s
  fireRate: 8,           // shots per second while the trigger is held
  bulletSpeed: 70,       // units/s
  spread: 0.05,          // radians of random aim wobble
  botFireRate: 2.6,      // bot shots per second
  botWobble: 0.32,       // radians a bot's aim wanders
  reviveRange: 1.8,      // stand this close to a downed teammate ...
  reviveTime: 2.5,       // ... for this many seconds to get them back up
  board: "best-wave",    // leaderboard name
};
const BOT_NAMES = ["Sarge", "Doc", "Rook", "Ace", "Patch"];
const COLORS = ["#ffb347", "#5ab0ff", "#ff6b9a", "#7ee081", "#c79bff", "#ffe066"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'zombie-waves',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {

  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},

}
async function connect() {

  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }

}
const isHost = () => livePlayers()[0] === net.sessionId;

// ── WORLD ───────────────────────────────────────────────────────────────────────────
const TAU = Math.PI * 2;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#0c1316");
scene.fog = new THREE.Fog("#0c1316", 34, 80);
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 220);
function fit() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
  camera.fov = innerHeight > innerWidth ? 62 : 50; camera.updateProjectionMatrix();
}
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
scene.add(new THREE.HemisphereLight("#9db8dd", "#26301f", 1.2));
const moon = new THREE.DirectionalLight("#d4e2ff", 1.6);
moon.position.set(-22, 40, 18); moon.castShadow = true; moon.shadow.mapSize.set(1024, 1024);
Object.assign(moon.shadow.camera, { left: -36, right: 36, top: 36, bottom: -36, near: 1, far: 110 });
scene.add(moon);

function canvasTex(w, h, paint, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; paint(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
  return t;
}
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const seeded = mulberry32(11); // the same scenery for everyone
const mesh = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };

const dirt = canvasTex(256, 256, (c, w, h) => {
  c.fillStyle = "#2b3826"; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) { c.fillStyle = ["#33432c", "#25301f", "#3a3b2a", "#2f3d27"][i % 4]; c.fillRect(seeded() * w, seeded() * h, 2 + seeded() * 5, 2 + seeded() * 5); }
}, 34);
const ground = mesh(new THREE.PlaneGeometry(220, 220), new THREE.MeshStandardMaterial({ map: dirt, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// The base: a concrete pad with hazard stripes, the generator in the middle.
const concrete = canvasTex(256, 256, (c, w, h) => {
  c.fillStyle = "#5d6461"; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { c.fillStyle = `rgba(0,0,0,${seeded() * 0.12})`; c.fillRect(seeded() * w, seeded() * h, 3, 3); }
  c.strokeStyle = "#00000044"; c.lineWidth = 2; for (let g = 0; g <= w; g += 64) { c.beginPath(); c.moveTo(g, 0); c.lineTo(g, h); c.moveTo(0, g); c.lineTo(w, g); c.stroke(); }
}, 3);
const pad = mesh(new THREE.CircleGeometry(8, 48), new THREE.MeshStandardMaterial({ map: concrete, roughness: 0.95 }), 0, 0.02, 0);
pad.rotation.x = -Math.PI / 2; pad.receiveShadow = true; scene.add(pad);
const stripes = canvasTex(64, 16, (c) => { c.fillStyle = "#f5c400"; c.fillRect(0, 0, 64, 16); c.fillStyle = "#151515"; c.beginPath(); c.moveTo(0, 0); c.lineTo(28, 0); c.lineTo(44, 16); c.lineTo(16, 16); c.fill(); }, 1);
const ringGeo = new THREE.RingGeometry(8, 8.7, 96, 1), ringUv = ringGeo.attributes.uv;
for (let j = 0; j <= 1; j++) for (let i = 0; i <= 96; i++) ringUv.setXY(j * 97 + i, i / 96 * 40, j); // stripes run around the ring
const ring = mesh(ringGeo, new THREE.MeshStandardMaterial({ map: stripes }), 0, 0.03, 0);
ring.rotation.x = -Math.PI / 2; scene.add(ring);

const gen = new THREE.Group(); scene.add(gen);
const metal = new THREE.MeshStandardMaterial({ color: "#6b787e", roughness: 0.55, metalness: 0.25 });
const coreMat = new THREE.MeshStandardMaterial({ color: "#2fd8c0", emissive: "#2fd8c0", emissiveIntensity: 1.6 });
gen.add(mesh(new THREE.BoxGeometry(2.6, 0.6, 2.6), metal, 0, 0.3, 0), mesh(new THREE.CylinderGeometry(0.62, 0.62, 2.2, 20), coreMat, 0, 1.7, 0), mesh(new THREE.BoxGeometry(1.6, 0.3, 1.6), metal, 0, 2.9, 0));
const genRings = [0, 1].map((i) => { const r = mesh(new THREE.TorusGeometry(1.05, 0.07, 8, 36), coreMat, 0, 1.2 + i * 1.0, 0); r.rotation.x = Math.PI / 2; gen.add(r); return r; });
gen.children.forEach((m) => { m.castShadow = true; });
const genLight = new THREE.PointLight("#5fffe0", 70, 34, 2); genLight.position.y = 3; gen.add(genLight);
// Lamp posts on the pad corners (glowing bulbs, no extra lights).
for (let i = 0; i < 4; i++) {
  const a = TAU * (i + 0.5) / 4, x = Math.sin(a) * 7.2, z = Math.cos(a) * 7.2;
  scene.add(mesh(new THREE.CylinderGeometry(0.1, 0.12, 4, 6), metal, x, 2, z), mesh(new THREE.SphereGeometry(0.28, 10, 8), new THREE.MeshBasicMaterial({ color: "#ffe9a8" }), x, 4.1, z));
}
// A broken fence at the edge of the arena, dark pines and rocks beyond it.
function scatter(geo, mat, count, place) {
  const m = new THREE.InstancedMesh(geo, mat, count), mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (let i = 0; i < count; i++) { const [x, y, z, s, ry, tilt] = place(i); mtx.compose(new THREE.Vector3(x, y, z), q.setFromEuler(e.set(tilt, ry, tilt * 0.5)), new THREE.Vector3(s, s, s)); m.setMatrixAt(i, mtx); }
  m.castShadow = true; scene.add(m); return m;
}
const wood = new THREE.MeshStandardMaterial({ color: "#4a3a2b", roughness: 1 });
scatter(new THREE.BoxGeometry(0.25, 1.6, 0.25), wood, 64, (i) => { const a = TAU * i / 64; return seeded() < 0.3 ? [0, -9, 0, 1, 0, 0] : [Math.sin(a) * 31.5, 0.7, Math.cos(a) * 31.5, 1, a, (seeded() - 0.5) * 0.5]; });
const ringSpot = (min, max) => { const a = seeded() * TAU, r = min + seeded() * (max - min); return [Math.sin(a) * r, Math.cos(a) * r]; };
scatter(new THREE.ConeGeometry(1.7, 6.5, 6), new THREE.MeshStandardMaterial({ color: "#18261e", flatShading: true }), 140, () => { const [x, z] = ringSpot(36, 80), s = 0.7 + seeded() * 0.9; return [x, 3.2 * s, z, s, seeded() * TAU, 0]; });
scatter(new THREE.DodecahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ color: "#4b5050", flatShading: true }), 50, () => { const [x, z] = ringSpot(33, 70), s = 0.4 + seeded() * 1.2; return [x, s * 0.4, z, s, seeded() * TAU, seeded()]; });

// ── SURVIVORS ───────────────────────────────────────────────────────────────────────
const skinMat = new THREE.MeshStandardMaterial({ color: "#f1c7a0", roughness: 0.7 });
const darkMat = new THREE.MeshStandardMaterial({ color: "#2a2f3a", roughness: 0.8 });
const gunMat = new THREE.MeshStandardMaterial({ color: "#15171c", roughness: 0.4, metalness: 0.5 });
function nameTag(text) {
  const tex = canvasTex(256, 64, (c) => { c.font = "bold 32px system-ui"; c.textAlign = "center"; c.lineWidth = 6; c.strokeStyle = "#000b"; c.strokeText(text, 128, 44); c.fillStyle = "#fff"; c.fillText(text, 128, 44); });

}
function makeSurvivor(color, name) {
  const g = new THREE.Group(), body = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
  body.add(mesh(new THREE.BoxGeometry(0.62, 0.8, 0.4), darkMat, 0, 0.4, 0), mesh(new THREE.BoxGeometry(0.82, 0.86, 0.5), mat, 0, 1.22, 0),
    mesh(new THREE.SphereGeometry(0.3, 14, 10), skinMat, 0, 1.92, 0), mesh(new THREE.SphereGeometry(0.33, 14, 8, 0, TAU, 0, Math.PI / 2), mat, 0, 1.98, 0),
    mesh(new THREE.BoxGeometry(0.14, 0.16, 0.95), gunMat, 0.3, 1.28, 0.55));
  body.children.forEach((m) => { m.castShadow = true; });
  const flash = mesh(new THREE.SphereGeometry(0.2, 8, 6), new THREE.MeshBasicMaterial({ color: "#fff2a0" }), 0.3, 1.28, 1.15); flash.visible = false; body.add(flash);
  const feet = mesh(new THREE.RingGeometry(0.55, 0.72, 28), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 }), 0, 0.04, 0);
  const help = mesh(new THREE.RingGeometry(1.5, 1.7, 36), new THREE.MeshBasicMaterial({ color: "#ff5d5d", transparent: true }), 0, 0.05, 0);
  const fill = mesh(new THREE.CircleGeometry(1.5, 36), new THREE.MeshBasicMaterial({ color: "#7ee081", transparent: true, opacity: 0.45 }), 0, 0.06, 0);
  for (const m of [feet, help, fill]) m.rotation.x = -Math.PI / 2;
  g.add(body, feet, help, fill);

  scene.add(g); return g;
}
/** Put a survivor model where survivor `s` is: standing, shooting, or down waiting for a revive. */
function poseSurvivor(g, s, t) {
  const u = g.userData, moved = Math.hypot(s.x - u.px, s.z - u.pz);
  u.walk += moved * 2.6; u.px = s.x; u.pz = s.z;
  g.position.set(s.x, 0, s.z); g.rotation.y = s.a;
  u.body.rotation.x = s.down ? -Math.PI / 2 : 0;
  u.body.position.y = s.down ? 0.3 : Math.abs(Math.sin(u.walk)) * 0.1;
  u.help.visible = u.fill.visible = !!s.down;

// ── ZOMBIES ─────────────────────────────────────────────────────────────────────────
// On the wire every zombie is 9 characters: id(2) x(2) z(2) heading(1) hp(1) type(1),
// numbers in base 36, positions to 0.1 units. Each field starts with "z" so it never looks
// like a number, and holds up to PER_FIELD zombies (2048 characters max per field).
const ZFIELDS = ["z0", "z1", "z2"], PER_FIELD = 200;

  if (now - host.lastBots > 100) {
    host.lastBots = now;
    net.setShared("bots", JSON.stringify(botList().map((b) => ({ id: b.id, name: b.name, color: b.color, x: +b.x.toFixed(2), z: +b.z.toFixed(2), a: +b.a.toFixed(2), hp: Math.round(b.hp), down: b.down, shots: b.shots, revive: +b.revive.toFixed(2) }))));
  }
  if (now - host.lastBite > 250) { host.lastBite = now; for (const [to, d] of Object.entries(host.bites)) net.send("bite", { to, d }); host.bites = {}; }
  if (host.baseDirty && now - host.lastBase > 250) { host.lastBase = now; host.baseDirty = false; net.setShared("base", JSON.stringify(baseNow())); }
}

// ── ME ──────────────────────────────────────────────────────────────────────────────
const myName = (() => { try { return localStorage.getItem("mpa-name") || ""; } catch { return ""; } })() ||
  ["Brave", "Lucky", "Steady", "Rusty", "Quick", "Calm"][Math.floor(Math.random() * 6)] + " " + ["Fox", "Bear", "Hawk", "Wolf", "Moose", "Otter"][Math.floor(Math.random() * 6)];
const me = { id: "", name: myName, color: COLORS[0], x: 0, z: 3, a: 0, hp: CONFIG.hp, down: 0, shots: 0, revive: 0, cd: 0, post: 0,
  g: null, gameId: -1, phaseKey: "", lastSend: 0, submittedFor: -1, bannerUntil: 0, hurtAt: 0 };
const input = { mx: 0, mz: 0, fire: false };

/** Everyone on the team: live people from state, the bots, and me. */
function team() {
  const out = [], live = new Set(livePlayers());
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const q = parseOnce("p:" + id, p.p, null);
    if (q) out.push({ id, name: p.n || "Survivor", color: p.c || "#ccc", ...q });
  }
  for (const b of botList()) out.push({ ...b, bot: true });
  out.push(me);
  return out;
}
function spawnMe() {
  const a = Math.random() * TAU; // somewhere around the generator
  Object.assign(me, { x: Math.sin(a) * 3.4, z: Math.cos(a) * 3.4, a, hp: CONFIG.hp, down: 0, revive: 0, post: a });
  zViews.clear(); bullets.length = 0;
}
/** A zombie bit me: I take it off my own health. */
function applyBite(d) {
  if (me.down) return;
  me.hp -= d; me.hurtAt = performance.now(); burst(me.x, 1.3, me.z, "#d0293b", 6, 3); sfx("hurt");
  if (me.hp <= 0) { Object.assign(me, { hp: 0, down: 1, revive: 0 }); sfx("down"); }
  publish(true);
}
/** My bullet hit zombie `id`: tell the host (or, as host, apply it). */
function shotHit(id) { if (host.acting) applyHit(id, 1, net.sessionId); else net.send("hit", { z: id }); }

function myTick(dt, w) {
  if (me.gameId !== w.id) { me.gameId = w.id; spawnMe(); }
  const key = w.id + ":" + w.n + ":" + w.phase;
  if (key !== me.phaseKey) {
    me.phaseKey = key;
    if (w.phase === "break") Object.assign(me, { hp: CONFIG.hp, down: 0, revive: 0 }); // everyone is back up between waves
    if (w.phase === "fight") { me.bannerUntil = performance.now() + 1800; sfx("wave"); }
  }
  if (me.down) reviveTick(me, team(), dt);
  else if (ATTRACT) stepBot(me, dt, team(), zombieList()); // the preview plays you like a bot
  else {
    const len = Math.hypot(input.mx, input.mz), k = len > 1 ? 1 / len : 1;
    me.x += input.mx * k * CONFIG.speed * dt; me.z += input.mz * k * CONFIG.speed * dt;
    keepInArena(me);
    me.cd -= dt;
    if (input.fire && me.cd <= 0) {
      me.cd = 1 / CONFIG.fireRate; me.shots = (me.shots + 1) % 1000;
      fire(me.x, me.z, me.a + (Math.random() - 0.5) * CONFIG.spread * 2, net.sessionId);
      if (me.g) me.g.userData.firedAt = performance.now();
      sfx("shot");
    }
  }
  publish(false);
}
function publish(force) {
  const now = performance.now();
  if (!force && now - me.lastSend < 100) return; // ~10/s
  me.lastSend = now;
  net.me.set("p", JSON.stringify({ x: +me.x.toFixed(2), z: +me.z.toFixed(2), a: +me.a.toFixed(2), hp: Math.round(me.hp), down: me.down, shots: me.shots, revive: +me.revive.toFixed(2) }));
}

// Everyone else's survivors, eased toward where they last said they were. Their shots are tracers.
const views = new Map(); // id -> { g, x, z, a, shots, hp }
function syncSurvivors(dt, t) {
  const seen = new Set(), k = 1 - Math.pow(0.0008, dt);
  for (const s of team()) {
    if (s === me) continue;
    seen.add(s.id);
    let v = views.get(s.id);
    if (v && v.color !== s.color) { scene.remove(v.g); v = null; } // a new color: rebuild the model
    if (!v) { v = { g: makeSurvivor(s.color, ATTRACT ? "" : s.name), color: s.color, x: s.x, z: s.z, a: s.a, shots: s.shots, hp: s.hp }; views.set(s.id, v); }
    const snap = s.bot && host.acting;
    v.x += (s.x - v.x) * (snap ? 1 : k); v.z += (s.z - v.z) * (snap ? 1 : k); v.a += Math.atan2(Math.sin(s.a - v.a), Math.cos(s.a - v.a)) * (snap ? 1 : k);
    const fired = (s.shots - v.shots + 1000) % 1000; v.shots = s.shots;
    if (fired && !snap) { for (let i = 0; i < Math.min(3, fired); i++) fire(v.x, v.z, v.a + (Math.random() - 0.5) * 0.1, null); v.g.userData.firedAt = performance.now(); }
    if (s.hp < v.hp) burst(v.x, 1.3, v.z, "#d0293b", 5, 3);
    v.hp = s.hp;
    poseSurvivor(v.g, { ...s, x: v.x, z: v.z, a: v.a }, t);
  }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); }
  if (me.g && me.g.userData.color !== me.color) { scene.remove(me.g); me.g = null; }
  if (!me.g) { me.g = makeSurvivor(me.color, ""); me.g.userData.color = me.color; }
  poseSurvivor(me.g, me, t);
}
/** Two people in one color: the one with the higher sessionId picks a color no person or bot has (a bot in a person's color is recolored by the host). */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === me.color && id < net.sessionId)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botList().map((b) => b.color)]), free = COLORS.find((c) => !taken.has(c));
  if (free) { me.color = free; net.me.set("c", free); }
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let board = null, lastGen = CONFIG.genHp, genHitAt = 0;
const startedAt = performance.now();
let dropped = false; // true while the connection is down: the HUD keeps showing "Reconnecting…"
function hud(w) {
  const b = baseNow(), now = performance.now(), t = Date.now();
  if (b.hp < lastGen) genHitAt = now;
  lastGen = b.hp;
  $("hurt").style.opacity = now - me.hurtAt < 250 ? 0.8 : me.down ? 0.45 : 0;
  if (ATTRACT) { for (const id of ["wave", "team", "msg", "hint", "net", "meText"]) $(id).textContent = ""; $("gen").style.display = $("me").style.display = "none"; return; }
  const left = zombieList().length + (b.queue || 0);
  $("wave").innerHTML = `Wave ${w.n}<small>${w.phase === "fight" ? `${left} zombie${left === 1 ? "" : "s"} left` : w.phase === "break" ? "Get ready" : ""}</small>`;
  $("genBar").style.width = Math.max(0, 100 * b.hp / CONFIG.genHp) + "%";
  $("genBar").style.background = now - genHitAt < 300 ? "#ff6b6b" : "";
  $("meText").textContent = me.down ? "You're down! A teammate can get you up" : `${Math.round(me.hp)} HP`;
  $("hpBar").style.width = Math.max(0, me.hp) + "%";
  $("team").innerHTML = team().map((s) => `<div class="${s === me ? "mine" : ""} ${s.down ? "down" : ""}"><span>${esc(s === me ? "You" : s.name)}</span><span class="bar"><i style="width:${Math.max(0, s.hp)}%"></i></span><span>${b.kills?.[s.id] || 0}</span></div>`).join("");
  $("msg").innerHTML = w.phase === "break" ? `Wave ${w.n} in ${Math.max(0, Math.ceil((w.endsAt - t) / 1000))}<small>${w.n > CONFIG.startWave ? "Everyone is back on their feet" : "Zombies come from every side"}</small>`
    : w.phase === "fight" && now < me.bannerUntil ? `Wave ${w.n}` : w.phase === "fight" && now - genHitAt < 1500 ? `<small>The generator is under attack!</small>` : "";
  const touch = matchMedia("(pointer: coarse)").matches;
  $("hint").textContent = now - startedAt < 9000 ? (touch ? "Left thumb moves · right thumb aims and shoots · stand by a downed friend to revive" : "WASD to move · aim with the mouse · hold click to shoot · stand by a downed friend to revive") : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the zombies" : ""}`;
  $("over").hidden = w.phase !== "over";
  if (w.phase === "over") {
    $("overSub").textContent = `You held out until wave ${w.n}.`;
    $("results").innerHTML = team().map((s) => ({ s, k: b.kills?.[s.id] || 0 })).sort((x, y) => y.k - x.k)
      .map(({ s, k }) => `<li class="${s === me ? "mine" : ""}">${esc(s === me ? myName : s.name)}<span>${k} kills</span></li>`).join("");
    $("next").textContent = `New game in ${Math.max(0, Math.ceil((w.endsAt - t) / 1000))}s`;
    if (me.submittedFor !== w.id) { me.submittedFor = w.id; showBoard(w.n); }
  }
}
function showBoard(reached) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  board.submit(reached).catch(() => null).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>wave ${e.score}</span></li>`).join("") : "<li>No scores yet. You're first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (isHost()) host.again = true; else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set(), mouse = { x: 0, y: 0, seen: false, down: false };
const MOVE = { w: [0, -1], arrowup: [0, -1], s: [0, 1], arrowdown: [0, 1], a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0] };
addEventListener("keydown", (e) => { const k = e.key.toLowerCase(); if (MOVE[k] || k === " ") e.preventDefault(); keys.add(k); });
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); mouse.down = false; });
addEventListener("pointerdown", () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
const cv = renderer.domElement;
// Twin thumb sticks: touch the left half to move, the right half to aim (and shoot).
const sticks = { move: null, aim: null };
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (e.pointerType === "mouse") { if (e.button === 0) mouse.down = true; return; }
  const side = e.clientX < innerWidth / 2 ? "move" : "aim";
  if (sticks[side]) return;
  sticks[side] = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, el: $(side === "move" ? "stickMove" : "stickAim") };
  Object.assign(sticks[side].el.style, { left: e.clientX + "px", top: e.clientY + "px" }); sticks[side].el.hidden = false;
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; mouse.seen = true; return; }
  for (const s of Object.values(sticks)) if (s && s.id === e.pointerId) {
    let dx = e.clientX - s.x0, dy = e.clientY - s.y0; const d = Math.hypot(dx, dy);
    if (d > 50) { dx *= 50 / d; dy *= 50 / d; }
    s.dx = dx; s.dy = dy; s.el.firstChild.style.transform = `translate(${dx}px, ${dy}px)`;
  }
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => {
  if (e.pointerType === "mouse") { if (e.button === 0) mouse.down = false; return; }
  for (const side of ["move", "aim"]) if (sticks[side] && sticks[side].id === e.pointerId) { sticks[side].el.hidden = true; sticks[side] = null; }
});
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), aimPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.28), aimAt = new THREE.Vector3();
/** Turn keys, mouse and sticks into this frame's move, aim and trigger. */
function readInput() {
  input.mx = input.mz = 0;
  for (const k of keys) if (MOVE[k]) { input.mx += MOVE[k][0]; input.mz += MOVE[k][1]; }
  if (sticks.move) { input.mx = sticks.move.dx / 50; input.mz = sticks.move.dy / 50; }
  const aimLen = sticks.aim ? Math.hypot(sticks.aim.dx, sticks.aim.dy) : 0;
  if (aimLen > 10) me.a = Math.atan2(sticks.aim.dx, sticks.aim.dy);
  else if (mouse.seen && !sticks.move) {
    ndc.set(mouse.x / innerWidth * 2 - 1, -(mouse.y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(aimPlane, aimAt)) me.a = Math.atan2(aimAt.x - me.x, aimAt.z - me.z);
  } else if (input.mx || input.mz) me.a = Math.atan2(input.mx, input.mz);
  input.fire = aimLen > 22 || mouse.down || keys.has(" ");
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const focus = new THREE.Vector3(), camOff = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  const t = now / 1000;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const w = wave();
  if (!ATTRACT) readInput();
  if (w) myTick(dt, w);
  syncZombies(dt); drawZombies(dt, t);
  syncSurvivors(dt, t);
  stepBullets(dt); stepBits(dt);
  // the generator glows, spins, and flickers red when it is low
  const g = baseNow().hp / CONFIG.genHp;
  coreMat.emissive.setHSL(0.47 * Math.max(0, g), 0.8, 0.5); coreMat.emissiveIntensity = 1.4 + Math.sin(t * 4) * 0.3;
  genRings[0].rotation.z += dt * 1.5; genRings[1].rotation.z -= dt * 1.1;
  genLight.color.copy(coreMat.emissive); genLight.intensity = 60 + Math.sin(t * 4) * 12 - (now - genHitAt < 150 ? 40 : 0);
  // a 3/4 camera that follows me (higher and wider on a phone held upright)
  const tall = innerHeight > innerWidth ? 1.55 : 1;
  camOff.set(0, 21, 13).multiplyScalar(tall * (ATTRACT ? 0.68 : 1));
  focus.lerp(P3.set(me.x * (ATTRACT ? 0.5 : 1), 0, me.z * (ATTRACT ? 0.5 : 1)), 1 - Math.pow(0.002, dt));
  camera.position.copy(focus).add(camOff);
  if (now - me.hurtAt < 200) camera.position.x += (Math.random() - 0.5) * 0.4;
  camera.lookAt(focus);
  renderer.render(scene, camera);
  if (w && now - lastHud > 100) { lastHud = now; hud(w); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (msg, from) => { if (host.acting && msg && typeof msg.z === "number") applyHit(msg.z, 1, from); });
  net.on("bite", (msg) => { if (msg && msg.to === net.sessionId) applyBite(Math.min(100, Number(msg.d) || 0)); });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...readBots().map((b) => b.color)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { team: 3, startWave: 6, firstBreak: 200, breakMs: 1200, spawnEvery: 0.08, spawnRadius: 17, waveSize: 50, genHp: 999 });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
